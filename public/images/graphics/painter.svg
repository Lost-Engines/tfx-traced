<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc"><title id="title">Sort keys control whole parts</title><desc id="desc">Water with a positive depth bias draws before the rig. Smoke with a negative bias draws after it. Bias does not move any vertices.</desc><rect width="100%" height="100%" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="35" y="42" fill="#e6eceb" font-size="26">Paint order</text><text x="35" y="78" fill="#abbcc5" font-size="20">Camera depth + header bias</text>
