<text x="35" y="217" fill="#edca82" font-size="26">2</text><text x="80" y="217" fill="#e6eceb" font-size="24">Structure</text><text x="270" y="217" fill="#88cdbd" font-size="24">0</text>
<text x="35" y="292" fill="#edca82" font-size="26">3</text><text x="80" y="292" fill="#e6eceb" font-size="24">Smoke</text><text x="270" y="292" fill="#88cdbd" font-size="24">−100</text>
