<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc"><title id="title">Overlapping screen-door smoke</title><desc id="desc">Two overlapping circles share the same half-coverage checker pattern. Their overlap keeps the same holes.</desc><rect width="100%" height="100%" fill="#111e29"/><g font-family="system-ui, sans-serif"><defs><pattern id="terrain" width="128" height="128" patternUnits="userSpaceOnUse"><rect width="128" height="128" fill="#34434a"/><path d="M0,0H64V64H0ZM64,64H128V128H64Z" fill="#465254"/></pattern><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M8,0H16V8H8ZM0,8H8V16H0Z" fill="#c5d0bd"/></pattern></defs>
<text x="40" y="39" fill="#e6eceb" font-size="25">The mask stays in screen coordinates</text><rect x="40" y="65" width="880" height="280" fill="url(#terrain)"/>
<circle cx="405" cy="204" r="110" fill="url(#dots)"/><circle cx="541" cy="204" r="110" fill="url(#dots)"/>
<text x="40" y="391" fill="#abbcc5" font-size="23">One circle: half coverage</text><text x="515" y="391" fill="#edca82" font-size="23">Overlap: still half coverage</text></g></svg>
