<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc"><title id="title">One vertex, three coordinate systems</title><desc id="desc">Local model coordinates are rotated and placed in the world, then transformed relative to the camera.</desc><rect width="100%" height="100%" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="90" y="34" fill="#e6eceb" font-size="25">Model</text><g transform="translate(145,145) rotate(0)"><path d="M0,-80 L13,-16 L81,39 L81,52 L14,30 L10,65 L30,78 L30,86 L0,77 L-30,86 L-30,78 L-10,65 L-14,30 L-81,52 L-81,39 L-13,-16 Z" fill="#48776f" stroke="#88cdbd" stroke-width="2"/><circle cx="54" cy="32" r="6" fill="#edca82"/></g><path d="M45,245 L250,245" fill="none" stroke="#304453" stroke-width="2"/><path d="M45,245 L45,65" fill="none" stroke="#304453" stroke-width="2"/><text x="30" y="281" fill="#abbcc5" font-size="18">A point on the wing</text><text x="280" y="160" fill="#edca82" font-size="34">→</text><text x="415" y="34" fill="#e6eceb" font-size="25">World</text><g transform="translate(470,145) rotate(32)"><path d="M0,-80 L13,-16 L81,39 L81,52 L14,30 L10,65 L30,78 L30,86 L0,77 L-30,86 L-30,78 L-10,65 L-14,30 L-81,52 L-81,39 L-13,-16 Z" fill="#48776f" stroke="#88cdbd" stroke-width="2"/><circle cx="54" cy="32" r="6" fill="#edca82"/></g><path d="M370,245 L575,245" fill="none" stroke="#304453" stroke-width="2"/><path d="M370,245 L370,65" fill="none" stroke="#304453" stroke-width="2"/><text x="355" y="281" fill="#abbcc5" font-size="18">Rotate, then translate</text><text x="605" y="160" fill="#edca82" font-size="34">→</text><text x="745" y="34" fill="#e6eceb" font-size="25">Camera</text><g transform="translate(800,145) rotate(70)"><path d="M0,-80 L13,-16 L81,39 L81,52 L14,30 L10,65 L30,78 L30,86 L0,77 L-30,86 L-30,78 L-10,65 L-14,30 L-81,52 L-81,39 L-13,-16 Z" fill="#48776f" stroke="#88cdbd" stroke-width="2"/><circle cx="54" cy="32" r="6" fill="#edca82"/></g><path d="M700,245 L905,245" fill="none" stroke="#304453" stroke-width="2"/><path d="M700,245 L700,65" fill="none" stroke="#304453" stroke-width="2"/><text x="685" y="281" fill="#abbcc5" font-size="18">Relative to the eye</text></g></svg>
