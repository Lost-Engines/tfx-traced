<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 870" width="320" height="870" role="img" aria-labelledby="title desc"><title id="title">One vertex, three coordinate systems</title><desc id="desc">Model, world and camera frames arranged vertically.</desc><rect width="100%" height="100%" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="22" y="30" fill="#e6eceb" font-size="24">1. Model</text><g transform="translate(160,138) rotate(0)"><path d="M0,-80 L13,-16 L81,39 L81,52 L14,30 L10,65 L30,78 L30,86 L0,77 L-30,86 L-30,78 L-10,65 L-14,30 L-81,52 L-81,39 L-13,-16 Z" fill="#48776f" stroke="#88cdbd" stroke-width="2"/><circle cx="54" cy="32" r="6" fill="#edca82"/></g><path d="M32,240 L290,240" fill="none" stroke="#304453" stroke-width="2"/><path d="M32,240 L32,61" fill="none" stroke="#304453" stroke-width="2"/><text x="22" y="270" fill="#abbcc5" font-size="18">A point on the wing</text><text x="22" y="320" fill="#e6eceb" font-size="24">2. World</text><g transform="translate(160,428) rotate(32)"><path d="M0,-80 L13,-16 L81,39 L81,52 L14,30 L10,65 L30,78 L30,86 L0,77 L-30,86 L-30,78 L-10,65 L-14,30 L-81,52 L-81,39 L-13,-16 Z" fill="#48776f" stroke="#88cdbd" stroke-width="2"/><circle cx="54" cy="32" r="6" fill="#edca82"/></g><path d="M32,530 L290,530" fill="none" stroke="#304453" stroke-width="2"/><path d="M32,530 L32,351" fill="none" stroke="#304453" stroke-width="2"/><text x="22" y="560" fill="#abbcc5" font-size="18">Rotate, then translate</text><text x="22" y="610" fill="#e6eceb" font-size="24">3. Camera</text><g transform="translate(160,718) rotate(70)"><path d="M0,-80 L13,-16 L81,39 L81,52 L14,30 L10,65 L30,78 L30,86 L0,77 L-30,86 L-30,78 L-10,65 L-14,30 L-81,52 L-81,39 L-13,-16 Z" fill="#48776f" stroke="#88cdbd" stroke-width="2"/><circle cx="54" cy="32" r="6" fill="#edca82"/></g><path d="M32,820 L290,820" fill="none" stroke="#304453" stroke-width="2"/><path d="M32,820 L32,641" fill="none" stroke="#304453" stroke-width="2"/><text x="22" y="850" fill="#abbcc5" font-size="18">Relative to the eye</text></g></svg>
