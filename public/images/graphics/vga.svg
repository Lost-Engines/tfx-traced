<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="960" height="395" role="img" aria-labelledby="title desc"><title id="title">The four VGA planes</title><desc id="desc">Consecutive pixels use different planes at the same byte address. Pixels four positions apart occupy successive bytes of the same plane.</desc><rect width="100%" height="100%" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="40" fill="#e6eceb" font-size="25">Screen pixels</text><rect x="220" y="62" width="73" height="48" fill="#88cdbd"/><text x="248" y="95" fill="#111e29" font-size="24">0</text><rect x="300" y="62" width="73" height="48" fill="#edca82"/><text x="328" y="95" fill="#111e29" font-size="24">1</text><rect x="380" y="62" width="73" height="48" fill="#b0acd0"/><text x="408" y="95" fill="#111e29" font-size="24">2</text><rect x="460" y="62" width="73" height="48" fill="#e1a59c"/><text x="488" y="95" fill="#111e29" font-size="24">3</text><rect x="540" y="62" width="73" height="48" fill="#88cdbd"/><text x="568" y="95" fill="#111e29" font-size="24">4</text><rect x="620" y="62" width="73" height="48" fill="#edca82"/><text x="648" y="95" fill="#111e29" font-size="24">5</text><rect x="700" y="62" width="73" height="48" fill="#b0acd0"/><text x="728" y="95" fill="#111e29" font-size="24">6</text><rect x="780" y="62" width="73" height="48" fill="#e1a59c"/><text x="808" y="95" fill="#111e29" font-size="24">7</text><text x="164" y="95" fill="#abbcc5" font-size="23">x =</text><text x="320" y="152" fill="#e6eceb" font-size="22">Byte address 0</text><text x="645" y="152" fill="#e6eceb" font-size="22">Byte address 1</text><text x="50" y="201" fill="#88cdbd" font-size="22">Plane 0</text><rect x="300" y="170" width="210" height="38" rx="2" fill="#88cdbd"/><text x="355" y="196" fill="#111e29" font-size="21">pixel 0</text><rect x="620" y="170" width="210" height="38" rx="2" fill="#88cdbd"/><text x="675" y="196" fill="#111e29" font-size="21">pixel 4</text><text x="50" y="248" fill="#edca82" font-size="22">Plane 1</text><rect x="300" y="217" width="210" height="38" rx="2" fill="#edca82"/><text x="355" y="243" fill="#111e29" font-size="21">pixel 1</text><rect x="620" y="217" width="210" height="38" rx="2" fill="#edca82"/><text x="675" y="243" fill="#111e29" font-size="21">pixel 5</text><text x="50" y="295" fill="#b0acd0" font-size="22">Plane 2</text><rect x="300" y="264" width="210" height="38" rx="2" fill="#b0acd0"/><text x="355" y="290" fill="#111e29" font-size="21">pixel 2</text><rect x="620" y="264" width="210" height="38" rx="2" fill="#b0acd0"/><text x="675" y="290" fill="#111e29" font-size="21">pixel 6</text><text x="50" y="342" fill="#e1a59c" font-size="22">Plane 3</text><rect x="300" y="311" width="210" height="38" rx="2" fill="#e1a59c"/><text x="355" y="337" fill="#111e29" font-size="21">pixel 3</text><rect x="620" y="311" width="210" height="38" rx="2" fill="#e1a59c"/><text x="675" y="337" fill="#111e29" font-size="21">pixel 7</text><text x="215" y="376" fill="#abbcc5" font-size="22">address = page base + 80 × y + floor(x / 4)</text></g></svg>
