<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 455" width="320" height="455" role="img" aria-labelledby="title desc"><title id="title">The four VGA planes</title><desc id="desc">Consecutive pixels select different planes. One byte address spans four neighbouring screen pixels.</desc><rect width="100%" height="100%" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="20" y="33" fill="#e6eceb" font-size="24">Screen pixels</text><rect x="22" y="55" width="32" height="35" fill="#88cdbd"/><text x="32" y="80" fill="#111e29" font-size="20">0</text><rect x="57" y="55" width="32" height="35" fill="#edca82"/><text x="67" y="80" fill="#111e29" font-size="20">1</text><rect x="92" y="55" width="32" height="35" fill="#b0acd0"/><text x="102" y="80" fill="#111e29" font-size="20">2</text><rect x="127" y="55" width="32" height="35" fill="#e1a59c"/><text x="137" y="80" fill="#111e29" font-size="20">3</text><rect x="162" y="55" width="32" height="35" fill="#88cdbd"/><text x="172" y="80" fill="#111e29" font-size="20">4</text><rect x="197" y="55" width="32" height="35" fill="#edca82"/><text x="207" y="80" fill="#111e29" font-size="20">5</text><rect x="232" y="55" width="32" height="35" fill="#b0acd0"/><text x="242" y="80" fill="#111e29" font-size="20">6</text><rect x="267" y="55" width="32" height="35" fill="#e1a59c"/><text x="277" y="80" fill="#111e29" font-size="20">7</text><text x="103" y="134" fill="#e6eceb" font-size="20">Byte 0</text><text x="223" y="134" fill="#e6eceb" font-size="20">Byte 1</text><text x="12" y="179" fill="#88cdbd" font-size="17">Plane 0</text><rect x="90" y="154" width="93" height="34" fill="#88cdbd"/><text x="110" y="178" fill="#111e29" font-size="18">pixel 0</text><rect x="210" y="154" width="93" height="34" fill="#88cdbd"/><text x="230" y="178" fill="#111e29" font-size="18">pixel 4</text><text x="12" y="224" fill="#edca82" font-size="17">Plane 1</text><rect x="90" y="199" width="93" height="34" fill="#edca82"/><text x="110" y="223" fill="#111e29" font-size="18">pixel 1</text><rect x="210" y="199" width="93" height="34" fill="#edca82"/><text x="230" y="223" fill="#111e29" font-size="18">pixel 5</text><text x="12" y="269" fill="#b0acd0" font-size="17">Plane 2</text><rect x="90" y="244" width="93" height="34" fill="#b0acd0"/><text x="110" y="268" fill="#111e29" font-size="18">pixel 2</text><rect x="210" y="244" width="93" height="34" fill="#b0acd0"/><text x="230" y="268" fill="#111e29" font-size="18">pixel 6</text><text x="12" y="314" fill="#e1a59c" font-size="17">Plane 3</text><rect x="90" y="289" width="93" height="34" fill="#e1a59c"/><text x="110" y="313" fill="#111e29" font-size="18">pixel 3</text><rect x="210" y="289" width="93" height="34" fill="#e1a59c"/><text x="230" y="313" fill="#111e29" font-size="18">pixel 7</text><text x="20" y="370" fill="#abbcc5" font-size="19">plane = x &amp; 3</text><text x="20" y="404" fill="#abbcc5" font-size="18">address = page base</text><text x="20" y="432" fill="#abbcc5" font-size="18">+ 80 × y + floor(x / 4)</text></g></svg>
