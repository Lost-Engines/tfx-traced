<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc"><title id="title">Clip before dividing</title><desc id="desc">An edge with one endpoint behind the depth-16 plane is shortened at its intersection. Depth bisection visits 36, 14, 25, 19 and 16.</desc><rect width="100%" height="100%" fill="#111e29"/><g font-family="system-ui, sans-serif"><rect x="45" y="65" width="210" height="210" fill="#34292b"/><rect x="255" y="65" width="105" height="210" fill="#383329"/>
<path d="M45,180 L920,180" fill="none" stroke="#abbcc5" stroke-width="2"/><path d="M360,55 L360,285" fill="none" stroke="#edca82" stroke-width="3"/><text x="365" y="36" fill="#edca82" font-size="24">Near plane: Z = 16</text>
<path d="M202,228 L780,124" fill="none" stroke="#abbcc5" stroke-dasharray="7 7" stroke-width="3"/>
<path d="M360,199 L780,124" fill="none" stroke="#88cdbd" stroke-width="4"/><circle cx="202" cy="228" r="7" fill="#db938b"/><circle cx="360" cy="199" r="7" fill="#edca82"/><circle cx="780" cy="124" r="7" fill="#88cdbd"/><circle cx="255" cy="180" r="6" fill="#e6eceb"/>
<text x="70" y="265" fill="#e6eceb" font-size="22">A: depth −8</text><text x="770" y="95" fill="#e6eceb" font-size="22">B: depth 80</text><text x="210" y="305" fill="#e6eceb" font-size="22">Camera</text>
<text x="40" y="345" fill="#e6eceb" font-size="23">Bisect depth, then replay the same halves on X and Y.</text><text x="40" y="378" fill="#edca82" font-size="22">36 → 14 → 25 → 19 → 16</text></g></svg>
