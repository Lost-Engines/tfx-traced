<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" role="img" aria-label="Motor timing changes missile speed"><title>Motor timing changes missile speed</title><rect width="720" height="382" fill="#111e29" rx="3"/><g font-family="system-ui,sans-serif"><text x="24" y="31" fill="#e1e9e8" font-size="19" >The same motor, different update intervals</text><text x="24" y="54" fill="#acbec5" font-size="13" >Launch speed: 190.5 m/s · original-code measurements</text><text x="24" y="102" fill="#e1e9e8" font-size="14" >50 ticks of boost</text><rect x="190" y="101" width="241.27" height="13" fill="#edca82"/><text x="438.27" y="112" fill="#e1e9e8" font-size="12" >460</text><rect x="190" y="122" width="150.36" height="13" fill="#8ccfbd"/><text x="347.36" y="133" fill="#e1e9e8" font-size="12" >287</text><text x="190" y="152" fill="#acbec5" font-size="11" >Sidewinder / ASRAAM / AAAM / Maverick</text><text x="24" y="189" fill="#e1e9e8" font-size="14" >100 ticks of boost</text><rect x="190" y="188" width="391.13" height="13" fill="#edca82"/><text x="588.13" y="199" fill="#e1e9e8" font-size="12" >746</text><rect x="190" y="209" width="212.8" height="13" fill="#8ccfbd"/><text x="409.8" y="220" fill="#e1e9e8" font-size="12" >406</text><text x="190" y="239" fill="#acbec5" font-size="11" >AGM 109 H / Sidearm / Harpoon</text><text x="24" y="276" fill="#e1e9e8" font-size="14" >120 ticks of boost</text><rect x="190" y="275" width="453.58" height="13" fill="#edca82"/><text x="650.58" y="286" fill="#e1e9e8" font-size="12" >865</text><rect x="190" y="296" width="237.78" height="13" fill="#8ccfbd"/><text x="434.78" y="307" fill="#e1e9e8" font-size="12" >453</text><text x="190" y="326" fill="#acbec5" font-size="11" >AMRAAM / AA-ARM / HARM</text><rect x="24" y="338" width="12" height="12" fill="#edca82"/><text x="44" y="349" fill="#e1e9e8" font-size="12" >4 ticks per update</text><rect x="235" y="338" width="12" height="12" fill="#8ccfbd"/><text x="255" y="349" fill="#e1e9e8" font-size="12" >10 ticks per update</text><text x="24" y="369" fill="#acbec5" font-size="12" >Numbers at the bar ends are metres per model second.</text></g></svg>
