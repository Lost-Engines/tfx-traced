<svg xmlns="http://www.w3.org/2000/svg" width="360" height="476" viewBox="0 0 360 476" role="img" aria-label="Motor timing changes missile speed"><title>Motor timing changes missile speed</title><rect width="360" height="476" fill="#111e29" rx="3"/><g font-family="system-ui,sans-serif"><text x="24" y="31" fill="#e1e9e8" font-size="14" >The same motor, different update intervals</text><text x="24" y="54" fill="#acbec5" font-size="11" >Launch speed: 190.5 m/s · original-code measurements</text><text x="26" y="96" fill="#e1e9e8" font-size="14" >50 ticks of boost</text><text x="26" y="114" fill="#acbec5" font-size="10" >Sidewinder / ASRAAM / AAAM / Maverick</text><rect x="30" y="123" width="139.04" height="13" fill="#edca82"/><text x="176.04" y="134" fill="#e1e9e8" font-size="12" >460</text><rect x="30" y="144" width="86.65" height="13" fill="#8ccfbd"/><text x="123.65" y="155" fill="#e1e9e8" font-size="12" >287</text><text x="26" y="200" fill="#e1e9e8" font-size="14" >100 ticks of boost</text><text x="26" y="218" fill="#acbec5" font-size="10" >AGM 109 H / Sidearm / Harpoon</text><rect x="30" y="227" width="225.4" height="13" fill="#edca82"/><text x="262.4" y="238" fill="#e1e9e8" font-size="12" >746</text><rect x="30" y="248" width="122.63" height="13" fill="#8ccfbd"/><text x="159.63" y="259" fill="#e1e9e8" font-size="12" >406</text><text x="26" y="304" fill="#e1e9e8" font-size="14" >120 ticks of boost</text><text x="26" y="322" fill="#acbec5" font-size="10" >AMRAAM / AA-ARM / HARM</text><rect x="30" y="331" width="261.38" height="13" fill="#edca82"/><text x="298.38" y="342" fill="#e1e9e8" font-size="12" >865</text><rect x="30" y="352" width="137.02" height="13" fill="#8ccfbd"/><text x="174.02" y="363" fill="#e1e9e8" font-size="12" >453</text><rect x="24" y="432" width="12" height="12" fill="#edca82"/><text x="44" y="443" fill="#e1e9e8" font-size="12" >4 ticks per update</text><rect x="195" y="432" width="12" height="12" fill="#8ccfbd"/><text x="215" y="443" fill="#e1e9e8" font-size="12" >10 ticks per update</text><text x="24" y="463" fill="#acbec5" font-size="10" >Numbers at the bar ends are metres per model second.</text></g></svg>
