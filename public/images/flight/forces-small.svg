<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-label="Force directions and angle of attack: Side view. Thrust follows the nose, drag opposes motion through the air, lift is perpendicular to that motion, and weight points down."><rect width="360" height="410" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="16" y="30" font-size="18" fill="#e6eceb" text-anchor="start">Nose direction ≠ flight path</text><g transform="translate(0,30) scale(0.5)"><path d="M110,242L155,242L155,210L172,210L191,237L359,237L380,225L405,225L424,232L490,237L530,245L489,250L355,251L278,273L245,273L284,251L163,251L121,260Z" transform="rotate(-25,325,245)" fill="#426960" stroke="#88cdbd" stroke-width="2"/><path d="M325,245L647,93" fill="none" stroke="#abbcc5" stroke-width="1" stroke-dasharray="5 5"/><path d="M325,245L648,208" fill="none" stroke="#edca82" stroke-width="1" stroke-dasharray="5 5"/><path d="M415,235 A91,91 0 0 0 406,207" fill="none" stroke="#edca82" stroke-width="2"/><text x="421" y="218" font-size="25" fill="#edca82" text-anchor="start">α</text><path d="M325,245L304,80" fill="none" stroke="#88cdbd" stroke-width="3" /><path d="M296,75L304,80L296,85" transform="rotate(-97.25319461272534,304,80)" fill="none" stroke="#88cdbd" stroke-width="3"/><path d="M325,245L325,392" fill="none" stroke="#db938b" stroke-width="3" /><path d="M317,387L325,392L317,397" transform="rotate(90,325,392)" fill="none" stroke="#db938b" stroke-width="3"/><path d="M325,245L525,150" fill="none" stroke="#e6eceb" stroke-width="3" /><path d="M517,145L525,150L517,155" transform="rotate(-25.407718108948472,525,150)" fill="none" stroke="#e6eceb" stroke-width="3"/><path d="M325,245L165,264" fill="none" stroke="#edca82" stroke-width="3" /><path d="M157,259L165,264L157,269" transform="rotate(173.22784003388645,165,264)" fill="none" stroke="#edca82" stroke-width="3"/><circle cx="325" cy="245" r="5" fill="#e6eceb"/></g><text x="16" y="277" font-size="15" fill="#88cdbd" text-anchor="start">Lift ⟂ flight path</text><text x="16" y="304" font-size="15" fill="#edca82" text-anchor="start">Drag opposes flight path</text><text x="16" y="331" font-size="15" fill="#e6eceb" text-anchor="start">Thrust follows the body</text><text x="16" y="358" font-size="15" fill="#db938b" text-anchor="start">Weight points down</text><text x="16" y="391" font-size="15" fill="#edca82" text-anchor="start">α = angle of attack</text></g></svg>
