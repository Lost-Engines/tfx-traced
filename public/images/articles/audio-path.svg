<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="From a cue to the speakers"><title>From a cue to the speakers</title><desc>The game selects a cue; the independent PIT interrupt advances the sequencer. Device output drives a synthesiser.</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="45" font-size="30" fill="#e6eceb" text-anchor="start">From a cue to the speakers</text><rect x="35" y="85" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="50" y="122" font-size="24" fill="#edca82" text-anchor="start">Game cue</text><text x="50" y="156" font-size="21" fill="#e6eceb" text-anchor="start">Resource and order</text><rect x="470" y="85" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="485" y="122" font-size="24" fill="#edca82" text-anchor="start">PIT interrupt</text><text x="485" y="156" font-size="21" fill="#e6eceb" text-anchor="start">54.62 ticks/s</text><path d="M232.5 185 L450 235" fill="none" stroke="#88cdbd" stroke-width="3"/><path d="M667.5 185 L450 235" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="245" y="235" width="410" height="95" rx="8" fill="#1b2d39" stroke="#88cdbd" stroke-width="2"/><text x="263" y="272" font-size="25" fill="#88cdbd" text-anchor="start">OSL sequencer</text><text x="263" y="306" font-size="21" fill="#e6eceb" text-anchor="start">Rows, channels, ongoing effects</text><path d="M450 330 L232.5 380" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="35" y="380" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="53" y="417" font-size="25" fill="#e6eceb" text-anchor="start">Device driver</text><text x="53" y="452" font-size="20" fill="#e6eceb" text-anchor="start">OPL registers or MIDI messages</text><text x="440" y="441" font-size="27" fill="#88cdbd" text-anchor="start">→</text><rect x="470" y="380" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="488" y="417" font-size="25" fill="#e6eceb" text-anchor="start">Synthesiser</text><text x="488" y="452" font-size="20" fill="#e6eceb" text-anchor="start">Instrument voices and audio</text></g></svg>
