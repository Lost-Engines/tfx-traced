<svg xmlns="http://www.w3.org/2000/svg" width="520" height="740" viewBox="0 0 520 740" role="img" aria-label="Calling the original code"><title>Calling the original code</title><desc>Declared inputs feed original and C++ routines independently. Their returned state and outputs are compared.</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="45" font-size="26" fill="#e6eceb" text-anchor="start">Calling the original code</text><rect x="40" y="80" width="440" height="88" rx="8" fill="#1b2d39" stroke="#edca82" stroke-width="2"/><text x="58" y="113" font-size="24" fill="#edca82" text-anchor="start">Declared inputs</text><text x="58" y="144" font-size="19" fill="#e6eceb" text-anchor="start">State, resources, input and time</text><path d="M260 168 L135 220" fill="none" stroke="#88cdbd" stroke-width="3"/><path d="M260 168 L385 220" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="25" y="220" width="220" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="40" y="255" font-size="22" fill="#e6eceb" text-anchor="start">Original routine</text><text x="40" y="288" font-size="18" fill="#aabdc6" text-anchor="start">Relocate and call</text><rect x="275" y="220" width="220" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="290" y="255" font-size="22" fill="#e6eceb" text-anchor="start">C++ routine</text><text x="290" y="288" font-size="18" fill="#aabdc6" text-anchor="start">Same case inputs</text><path d="M135 320 L260 375" fill="none" stroke="#88cdbd" stroke-width="3"/><path d="M385 320 L260 375" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="40" y="375" width="440" height="100" rx="8" fill="#1b2d39" stroke="#88cdbd" stroke-width="2"/><text x="58" y="411" font-size="25" fill="#88cdbd" text-anchor="start">Compare the outputs</text><text x="58" y="446" font-size="18" fill="#e6eceb" text-anchor="start">State, requests, pixels and palette</text><text x="40" y="550" font-size="22" fill="#aabdc6" text-anchor="start">DOS and device calls are hosted</text><text x="40" y="581" font-size="22" fill="#aabdc6" text-anchor="start">at declared boundaries.</text><text x="40" y="612" font-size="22" fill="#aabdc6" text-anchor="start">The original routine still executes.</text></g></svg>
