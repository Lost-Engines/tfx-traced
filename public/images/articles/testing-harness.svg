<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Calling the original code"><title>Calling the original code</title><desc>Declared inputs feed original and C++ routines independently. Their returned state and outputs are compared.</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="45" font-size="30" fill="#e6eceb" text-anchor="start">Calling the original code</text><rect x="245" y="80" width="410" height="88" rx="8" fill="#1b2d39" stroke="#edca82" stroke-width="2"/><text x="263" y="113" font-size="24" fill="#edca82" text-anchor="start">Declared inputs</text><text x="263" y="144" font-size="22" fill="#e6eceb" text-anchor="start">State, resources, input and time</text><path d="M450 168 L232.5 220" fill="none" stroke="#88cdbd" stroke-width="3"/><path d="M450 168 L667.5 220" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="35" y="220" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="50" y="255" font-size="25" fill="#e6eceb" text-anchor="start">Original routine</text><text x="50" y="288" font-size="21" fill="#aabdc6" text-anchor="start">Relocate and call</text><rect x="470" y="220" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="485" y="255" font-size="25" fill="#e6eceb" text-anchor="start">C++ routine</text><text x="485" y="288" font-size="21" fill="#aabdc6" text-anchor="start">Same case inputs</text><path d="M232.5 320 L450 375" fill="none" stroke="#88cdbd" stroke-width="3"/><path d="M667.5 320 L450 375" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="245" y="375" width="410" height="100" rx="8" fill="#1b2d39" stroke="#88cdbd" stroke-width="2"/><text x="263" y="411" font-size="25" fill="#88cdbd" text-anchor="start">Compare the outputs</text><text x="263" y="446" font-size="20" fill="#e6eceb" text-anchor="start">State, requests, pixels and palette</text></g></svg>
