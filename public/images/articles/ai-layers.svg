<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="One aircraft, several jobs"><title>One aircraft, several jobs</title><desc>Authored route: Waypoints, waits, attacks, radio. Formation relationship: Leader, offset, catch-up state. Combat and threats: Acquire, engage, withdraw, evade. Control commands: Pitch, heading, speed, manoeuvre. Motion and requests: Move, fire, notify, animate</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="30" fill="#e6eceb" text-anchor="start">One aircraft, several jobs</text><rect x="35" y="100" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="130" font-size="17" fill="#edca82" text-anchor="start">01</text><text x="51" y="157" font-size="22" fill="#e6eceb" text-anchor="start">Authored route</text><text x="51" y="185" font-size="17" fill="#aabdc6" text-anchor="start">Waypoints, waits, attacks, radio</text><text x="439" y="160" font-size="27" fill="#88cdbd" text-anchor="start">→</text><rect x="470" y="100" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="486" y="130" font-size="17" fill="#edca82" text-anchor="start">02</text><text x="486" y="157" font-size="22" fill="#e6eceb" text-anchor="start">Formation relationship</text><text x="486" y="185" font-size="17" fill="#aabdc6" text-anchor="start">Leader, offset, catch-up state</text><rect x="35" y="235" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="265" font-size="17" fill="#edca82" text-anchor="start">03</text><text x="51" y="292" font-size="22" fill="#e6eceb" text-anchor="start">Combat and threats</text><text x="51" y="320" font-size="17" fill="#aabdc6" text-anchor="start">Acquire, engage, withdraw, evade</text><text x="439" y="295" font-size="27" fill="#88cdbd" text-anchor="start">→</text><rect x="470" y="235"