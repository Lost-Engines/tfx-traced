<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="From briefing to debriefing"><title>From briefing to debriefing</title><desc>Career program: Briefing, menus, mission call. Flight: Targets, losses, player outcome. Mission FINISH: Conditions, score, return value. Career resumes: Retry, next mission, discipline. Pilot save: Variables and return locations</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="30" fill="#e6eceb" text-anchor="start">From briefing to debriefing</text><rect x="35" y="100" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="130" font-size="17" fill="#edca82" text-anchor="start">01</text><text x="51" y="157" font-size="22" fill="#e6eceb" text-anchor="start">Career program</text><text x="51" y="185" font-size="17" fill="#aabdc6" text-anchor="start">Briefing, menus, mission call</text><text x="439" y="160" font-size="27" fill="#88cdbd" text-anchor="start">→</text><rect x="470" y="100" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="486" y="130" font-size="17" fill="#edca82" text-anchor="start">02</text><text x="486" y="157" font-size="22" fill="#e6eceb" text-anchor="start">Flight</text><text x="486" y="185" font-size="17" fill="#aabdc6" text-anchor="start">Targets, losses, player outcome</text><rect x="35" y="235" width="395" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="265" font-size="17" fill="#edca82" text-anchor="start">03</text><text x="51" y="292" font-size="22" fill="#e6eceb" text-anchor="start">Mission FINISH</text><text x="51" y="320" font-size="17" fill="#aabdc6" text-anchor="start">Conditions, score, return value</text><text x="439" y="295" font-size="27" fill="#88cdbd" text-anchor="start">→</text><rect x="470" y="235" width="395" height="100" rx="8" fill="#1b2d39" stro