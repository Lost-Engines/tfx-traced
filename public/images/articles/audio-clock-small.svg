<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" role="img" aria-label="The shared timer changes the duration"><title>The shared timer changes the duration</title><desc>500 ticks take 10.000 seconds at 50 Hz and 9.154 seconds in TFX.</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="44" font-size="27" fill="#e6eceb" text-anchor="start">500 sequencer ticks</text><text x="30" y="83" font-size="20" fill="#aabdc6" text-anchor="start">A fixed passage, timed by two clocks.</text><text x="35" y="145" font-size="24" fill="#aabdc6" text-anchor="start">Requested 50 Hz</text><rect x="35" y="165" width="430" height="42" rx="8" fill="#aabdc6" stroke="#aabdc6" stroke-width="2"/><text x="35" y="241" font-size="23" fill="#e6eceb" text-anchor="start">10.000 seconds</text><text x="35" y="280" font-size="24" fill="#88cdbd" text-anchor="start">TFX shared interrupt</text><rect x="35" y="300" width="393.6260352569851" height="42" rx="8" fill="#88cdbd" stroke="#88cdbd" stroke-width="2"/><text x="35" y="376" font-size="23" fill="#e6eceb" text-anchor="start">9.154 seconds</text><text x="30" y="494" font-size="25" fill="#edca82" text-anchor="start">0.846 seconds difference</text><text x="30" y="532" font-size="19" fill="#aabdc6" text-anchor="start">PIT: 1,193,182 Hz ÷ 21,845</text></g></svg>
