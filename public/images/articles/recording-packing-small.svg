<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" role="img" aria-label="The original fill and literal compressor"><title>The original fill and literal compressor</title><desc>Sparse parameters: 7 source bytes, 8 stored bytes including length.</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="26" fill="#e6eceb" text-anchor="start">Sparse parameters</text><text x="30" y="78" font-size="20" fill="#aabdc6" text-anchor="start">Fill byte: 00</text><rect x="25" y="105" width="470" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="45" y="136" font-size="19" fill="#aabdc6" text-anchor="start">Input</text><text x="45" y="176" font-size="18" fill="#e6eceb" text-anchor="start">00 00 00 07 08 00 00</text><text x="30" y="246" font-size="22" fill="#88cdbd" text-anchor="start">Stored length: 06 00</text><text x="35" y="285" font-size="18" fill="#e6eceb" text-anchor="start">3 fill + 2 literals  [07 08]</text><text x="35" y="321" font-size="18" fill="#e6eceb" text-anchor="start">2 fill + 0 literals</text><text x="30" y="546" font-size="23" fill="#edca82" text-anchor="start">7 input bytes → 8 stored bytes</text><text x="30" y="584" font-size="18" fill="#aabdc6" text-anchor="start">Stored size includes the two-byte length.</text></g></svg>
