<svg xmlns="http://www.w3.org/2000/svg" width="520" height="740" viewBox="0 0 520 740" role="img" aria-label="One aircraft, several jobs"><title>One aircraft, several jobs</title><desc>Authored route: Waypoints, waits, attacks, radio. Formation relationship: Leader, offset, catch-up state. Combat and threats: Acquire, engage, withdraw, evade. Control commands: Pitch, heading, speed, manoeuvre. Motion and requests: Move, fire, notify, animate</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="26" fill="#e6eceb" text-anchor="start">One aircraft, several jobs</text><rect x="35" y="90" width="450" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="120" font-size="17" fill="#edca82" text-anchor="start">01</text><text x="51" y="147" font-size="23" fill="#e6eceb" text-anchor="start">Authored route</text><text x="51" y="175" font-size="18" fill="#aabdc6" text-anchor="start">Waypoints, waits, attacks, radio</text><path d="M260 191 L260 212" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="35" y="216" width="450" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="246" font-size="17" fill="#edca82" text-anchor="start">02</text><text x="51" y="273" font-size="23" fill="#e6eceb" text-anchor="start">Formation relationship</text><text x="51" y="301" font-size="18" fill="#aabdc6" text-anchor="start">Leader, offset, catch-up state</text><path d="M260 317 L260 338" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="35" y="342" width="450" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="372" font-size="17" fill="#edca82" text-anchor="start">03</text><text x="51" y="399" font-size="23" fill="#e6eceb" text-anchor="start">Combat and threats</text><text x="51" y="427" font-size="18" fill="#aabdc6" text-anchor="start">Acquire, engage, withdraw, evade</text><path d="M260 443 L260 464" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="35" y="468" width="450" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="51" y="498" font-size="17" fill="#edca82" text-anchor="start">04</text><text x="51" y="525" font-size="23" fill="#e6eceb" text-anchor="start">Control commands</text><text x="51" y="553" font-size="18" fill="#aabdc6" text-anchor="start">Pitch, heading, speed, manoeuvre</text><path d="M260 569 L260 590" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="35" y="594" width="450" height="100" rx="8" fill="#1b2d39" stroke="#88cdbd" stroke-width="2"/><text x="51" y="624" font-size="17" fill="#edca82" text-anchor="start">05</text><text x="51" y="651" font-size="23" fill="#e6eceb" text-anchor="start">Motion and requests</text><text x="51" y="679" font-size="18" fill="#aabdc6" text-anchor="start">Move, fire, notify, animate</text></g></svg>
