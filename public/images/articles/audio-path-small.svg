<svg xmlns="http://www.w3.org/2000/svg" width="520" height="740" viewBox="0 0 520 740" role="img" aria-label="From a cue to the speakers"><title>From a cue to the speakers</title><desc>The game selects a cue; the independent PIT interrupt advances the sequencer. Device output drives a synthesiser.</desc><rect width="100%" height="100%" rx="5" fill="#111e29"/><g font-family="system-ui, sans-serif"><text x="30" y="45" font-size="26" fill="#e6eceb" text-anchor="start">From a cue to the speakers</text><rect x="25" y="85" width="220" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="40" y="122" font-size="24" fill="#edca82" text-anchor="start">Game cue</text><text x="40" y="156" font-size="18" fill="#e6eceb" text-anchor="start">Resource and order</text><rect x="275" y="85" width="220" height="100" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="290" y="122" font-size="24" fill="#edca82" text-anchor="start">PIT interrupt</text><text x="290" y="156" font-size="18" fill="#e6eceb" text-anchor="start">54.62 ticks/s</text><path d="M135 185 L260 235" fill="none" stroke="#88cdbd" stroke-width="3"/><path d="M385 185 L260 235" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="40" y="235" width="440" height="95" rx="8" fill="#1b2d39" stroke="#88cdbd" stroke-width="2"/><text x="58" y="272" font-size="25" fill="#88cdbd" text-anchor="start">OSL sequencer</text><text x="58" y="306" font-size="19" fill="#e6eceb" text-anchor="start">Rows, channels, ongoing effects</text><path d="M260 330 L260 375" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="40" y="375" width="440" height="95" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="58" y="413" font-size="25" fill="#e6eceb" text-anchor="start">Device driver</text><text x="58" y="446" font-size="20" fill="#e6eceb" text-anchor="start">OPL registers or MIDI messages</text><path d="M260 470 L260 515" fill="none" stroke="#88cdbd" stroke-width="3"/><rect x="40" y="515" width="440" height="95" rx="8" fill="#1b2d39" stroke="#405865" stroke-width="2"/><text x="58" y="553" font-size="25" fill="#e6eceb" text-anchor="start">Synthesiser</text><text x="58" y="586" font-size="20" fill="#e6eceb" text-anchor="start">Instrument voices and audio</text></g></svg>
